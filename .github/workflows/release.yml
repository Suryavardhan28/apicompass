name: Publish Extension

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Current Ref Is A Tag
        run: |
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)

          if [ -z "$TAG" ]; then
            echo "Current commit is not tagged"
            exit 1
          fi

          echo "Using tag: $TAG"

      - name: Verify Tag Is From Main Branch
        run: |
          git fetch origin main

          if ! git branch --remote --contains $GITHUB_SHA | grep origin/main; then
            echo "Tag is not from main branch"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Install Publishing Tools
        run: npm install -g vsce ovsx

      - name: Package Extension
        run: vsce package

      - name: Publish to VS Code Marketplace
        run: vsce publish -p ${{ secrets.VSCE_TOKEN }}

      - name: Publish to OpenVSX
        run: ovsx publish -p ${{ secrets.OVSX_TOKEN }}

      - name: Get VSIX File
        id: vsix
        run: |
          echo "VSIX_FILE=$(ls *.vsix)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vsix.outputs.VSIX_FILE }}
          generate_release_notes: true
